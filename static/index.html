<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Which Bin?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --bg: #eef6e8;
      --bg-2: #f7fbf3;
      --ink: #16301c;
      --muted: #4d6454;
      --card: #ffffff;
      --card-border: rgba(32, 72, 42, 0.1);
      --shadow: 0 10px 30px rgba(28, 62, 36, 0.08);
      --accent: #1f7a45;
      --accent-ink: #ffffff;
      --focus: #157a48;
      --ok: #e7f6ea;
      --ok-ink: #14532d;
      --ok-border: #86c99a;
      --warn: #fff4d8;
      --warn-ink: #7a4a08;
      --warn-border: #e8c36a;
      --err: #b42318;
      --err-bg: #fdecea;
      --line: #d7e5d6;
      --tap: 48px;
      --radius: 22px;
      --recycling: #1b8a5a;
      --paper: #2f74a8;
      --glass: #0f8588;
      --compost: #c45e12;
      --landfill: #5b6573;
      --dropoff: #6d4cc4;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #0e1711;
        --bg-2: #15201a;
        --ink: #e7f3e9;
        --muted: #9bb3a1;
        --card: #18241c;
        --card-border: rgba(180, 220, 190, 0.1);
        --shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
        --accent: #3dcc7a;
        --accent-ink: #062210;
        --focus: #5ee09a;
        --ok: #163525;
        --ok-ink: #c8f5d6;
        --ok-border: #2f7a4d;
        --warn: #3a2c12;
        --warn-ink: #ffe3a3;
        --warn-border: #8a6a22;
        --err: #ff8d82;
        --err-bg: #3a1c1a;
        --line: #2a3b30;
        --recycling: #43c07c;
        --paper: #6eb4e6;
        --glass: #3ec8cb;
        --compost: #f08a45;
        --landfill: #a9b2bf;
        --dropoff: #b49bff;
      }
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Nunito", system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 10% -10%, var(--bg-2), transparent 55%),
        radial-gradient(900px 500px at 110% 10%, rgba(61, 160, 90, 0.16), transparent 50%),
        var(--bg);
      line-height: 1.45;
      padding: calc(18px + var(--safe-top)) 16px calc(28px + var(--safe-bottom));
    }

    .wrap {
      width: min(560px, 100%);
      margin: 0 auto;
    }

    header {
      display: flex;
      gap: 14px;
      align-items: center;
      margin: 4px 2px 20px;
    }

    .logo {
      flex: 0 0 56px;
      width: 56px;
      height: 56px;
      border-radius: 18px;
      background: linear-gradient(160deg, #2ea35d, #146b3a);
      display: grid;
      place-items: center;
      box-shadow: 0 8px 18px rgba(20, 90, 40, 0.28);
    }

    .logo svg { width: 32px; height: 32px; }

    h1 {
      font-family: "Fraunces", Georgia, serif;
      font-size: 1.85rem;
      letter-spacing: -0.03em;
      margin: 0;
      line-height: 1.1;
    }

    .tagline {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.98rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
      margin-bottom: 14px;
    }

    h2 {
      margin: 0 0 4px;
      font-size: 1.08rem;
      font-weight: 800;
    }

    .hint {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .bins {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .chip {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: var(--tap);
      padding: 10px 12px;
      border: 1.5px solid var(--line);
      border-radius: 16px;
      cursor: pointer;
      user-select: none;
      background: transparent;
      transition: border-color 0.18s ease, background 0.18s ease, transform 0.18s ease;
    }

    .chip:active { transform: scale(0.985); }

    .chip input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .icon {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      flex: none;
      color: #fff;
    }

    .icon svg { width: 20px; height: 20px; }

    .chip .label {
      flex: 1;
      min-width: 0;
      font-weight: 700;
      font-size: 0.95rem;
      line-height: 1.25;
    }

    .tick {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid var(--line);
      display: grid;
      place-items: center;
      flex: none;
      transition: background 0.18s ease, border-color 0.18s ease;
    }

    .tick svg { width: 12px; height: 12px; opacity: 0; }

    .chip[data-bin="recycling"] .icon { background: var(--recycling); }
    .chip[data-bin="paper"] .icon { background: var(--paper); }
    .chip[data-bin="glass"] .icon { background: var(--glass); }
    .chip[data-bin="compost"] .icon { background: var(--compost); }
    .chip[data-bin="landfill"] .icon { background: var(--landfill); }
    .chip[data-bin="dropoff"] .icon { background: var(--dropoff); }

    .chip:has(input:checked) { border-color: currentColor; }
    .chip[data-bin="recycling"]:has(input:checked) { color: var(--recycling); background: color-mix(in srgb, var(--recycling) 12%, transparent); }
    .chip[data-bin="paper"]:has(input:checked) { color: var(--paper); background: color-mix(in srgb, var(--paper) 12%, transparent); }
    .chip[data-bin="glass"]:has(input:checked) { color: var(--glass); background: color-mix(in srgb, var(--glass) 12%, transparent); }
    .chip[data-bin="compost"]:has(input:checked) { color: var(--compost); background: color-mix(in srgb, var(--compost) 12%, transparent); }
    .chip[data-bin="landfill"]:has(input:checked) { color: var(--landfill); background: color-mix(in srgb, var(--landfill) 12%, transparent); }
    .chip[data-bin="dropoff"]:has(input:checked) { color: var(--dropoff); background: color-mix(in srgb, var(--dropoff) 12%, transparent); }

    .chip:has(input:checked) .tick {
      background: currentColor;
      border-color: currentColor;
    }
    .chip:has(input:checked) .tick svg { opacity: 1; color: #fff; }
    @media (prefers-color-scheme: dark) {
      .chip:has(input:checked) .tick svg { color: #122016; }
    }

    .chip:focus-within {
      outline: 3px solid color-mix(in srgb, var(--focus) 45%, transparent);
      outline-offset: 2px;
    }

    .drop {
      display: grid;
      place-items: center;
      min-height: 180px;
      border: 2px dashed var(--line);
      border-radius: 18px;
      padding: 18px;
      text-align: center;
      cursor: pointer;
      color: var(--muted);
      position: relative;
      overflow: hidden;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .drop:hover, .drop:focus-within {
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 6%, transparent);
    }

    .drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

    .drop-copy strong {
      display: block;
      color: var(--ink);
      font-size: 1.05rem;
      margin: 8px 0 2px;
    }

    #preview {
      display: none;
      width: 100%;
      max-height: 280px;
      object-fit: contain;
      border-radius: 14px;
      background: color-mix(in srgb, var(--ink) 6%, transparent);
    }

    .drop.has-photo .drop-copy { display: none; }
    .drop.has-photo #preview { display: block; }
    .drop.has-photo {
      border-style: solid;
      padding: 10px;
      min-height: 0;
    }

    .change {
      display: none;
      margin-top: 8px;
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--accent);
    }
    .drop.has-photo .change { display: block; }

    button#go {
      width: 100%;
      min-height: var(--tap);
      margin-top: 12px;
      border: 0;
      border-radius: 16px;
      background: var(--accent);
      color: var(--accent-ink);
      font: inherit;
      font-weight: 800;
      font-size: 1.05rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.15s ease, opacity 0.15s ease, filter 0.15s ease;
    }

    button#go:hover:not(:disabled) { filter: brightness(1.05); }
    button#go:active:not(:disabled) { transform: translateY(1px); }
    button#go:disabled { opacity: 0.45; cursor: default; }
    button#go.loading { opacity: 1; }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2.5px solid color-mix(in srgb, var(--accent-ink) 35%, transparent);
      border-top-color: var(--accent-ink);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    button#go.loading .spinner { display: block; }

    @keyframes spin { to { transform: rotate(360deg); } }

    #result {
      display: none;
    }

    .answer {
      border-radius: 18px;
      padding: 16px;
      border: 1.5px solid var(--ok-border);
      background: var(--ok);
      color: var(--ok-ink);
    }

    .answer.warn {
      border-color: var(--warn-border);
      background: var(--warn);
      color: var(--warn-ink);
    }

    .kicker {
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.8;
      margin: 0 0 4px;
    }

    .headline {
      font-family: "Fraunces", Georgia, serif;
      font-size: 1.45rem;
      line-height: 1.2;
      margin: 0 0 8px;
    }

    .note {
      margin: 0 0 12px;
      font-weight: 700;
    }

    .note:empty { display: none; }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .pill {
      background: color-mix(in srgb, currentColor 12%, transparent);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 0.88rem;
      font-weight: 800;
    }

    .explain, .tip {
      margin: 0;
      font-size: 0.98rem;
    }

    .explain { margin-bottom: 10px; }
    .explain:empty, .tip:empty { display: none; }

    .tip {
      padding: 10px 12px;
      border-radius: 12px;
      background: color-mix(in srgb, currentColor 10%, transparent);
      font-weight: 700;
    }

    #error {
      display: none;
      margin: 0 2px 8px;
      padding: 12px 14px;
      border-radius: 14px;
      background: var(--err-bg);
      color: var(--err);
      font-weight: 700;
      font-size: 0.95rem;
    }

    @media (min-width: 520px) {
      .bins { grid-template-columns: 1fr 1fr; }
      .chip[data-bin="recycling"],
      .chip[data-bin="dropoff"] { grid-column: 1 / -1; }
      body { padding-top: calc(28px + var(--safe-top)); }
      .headline { font-size: 1.65rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7.2 8.2 4.4 12l2.8 3.8"/>
          <path d="M16.8 8.2 19.6 12l-2.8 3.8"/>
          <path d="M8.2 19.2 12 21.2l3.8-2"/>
          <path d="M8.2 4.8 12 2.8l3.8 2"/>
          <path d="M5.8 14.2 4.4 12l1.4-2.2"/>
          <path d="M18.2 9.8 19.6 12l-1.4 2.2"/>
          <path d="M7.5 7.2c1.3-2.2 4.7-3.4 7.3-1.8"/>
          <path d="M16.5 16.8c-1.3 2.2-4.7 3.4-7.3 1.8"/>
        </svg>
      </div>
      <div>
        <h1>Which Bin?</h1>
        <p class="tagline">Snap a wrapper, bottle, or leftover — we’ll match it to the bins you actually have.</p>
      </div>
    </header>

    <section class="card" aria-labelledby="bins-title">
      <h2 id="bins-title">Your bins</h2>
      <p class="hint">Tick what you can use at home. We’ll remember this on this phone.</p>
      <div class="bins" id="bins">
        <label class="chip" data-bin="recycling">
          <input type="checkbox" value="recycling">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 20h10M8 20 4.8 13.2 8 8h8l3.2 5.2L16 20"/><path d="m9 12 2 2 4-4"/></svg>
          </span>
          <span class="label">Recycling (plastic, metal, cardboard)</span>
          <span class="tick" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m5 12 5 5 9-9"/></svg></span>
        </label>
        <label class="chip" data-bin="paper">
          <input type="checkbox" value="paper">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>
          </span>
          <span class="label">Paper-only bin</span>
          <span class="tick" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m5 12 5 5 9-9"/></svg></span>
        </label>
        <label class="chip" data-bin="glass">
          <input type="checkbox" value="glass">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3h8l-1 8a5 5 0 1 1-6 0z"/><path d="M9 21h6"/></svg>
          </span>
          <span class="label">Glass bin</span>
          <span class="tick" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m5 12 5 5 9-9"/></svg></span>
        </label>
        <label class="chip" data-bin="compost">
          <input type="checkbox" value="compost">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21c5-1 8-6 8-11-5 0-8 3-8 11z"/><path d="M12 21C7 20 4 15 4 10c5 0 8 3 8 11z"/><path d="M12 11V4"/></svg>
          </span>
          <span class="label">Compost / food scraps</span>
          <span class="tick" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m5 12 5 5 9-9"/></svg></span>
        </label>
        <label class="chip" data-bin="landfill">
          <input type="checkbox" value="landfill">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16l-1.2 13H5.2z"/><path d="M9 7V5h6v2M10 11v6M14 11v6"/></svg>
          </span>
          <span class="label">General trash</span>
          <span class="tick" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m5 12 5 5 9-9"/></svg></span>
        </label>
        <label class="chip" data-bin="dropoff">
          <input type="checkbox" value="dropoff">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="7" width="12" height="14" rx="2"/><path d="M9 7V5h6v2M9 12h.01M12 12h.01M15 12h.01"/></svg>
          </span>
          <span class="label">Special drop-off (e-waste, batteries, hazardous)</span>
          <span class="tick" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m5 12 5 5 9-9"/></svg></span>
        </label>
      </div>
    </section>

    <section class="card" aria-labelledby="photo-title">
      <h2 id="photo-title">Add a photo</h2>
      <p class="hint">Take a picture of one item, or pick one from your camera roll.</p>
      <label class="drop" id="drop">
        <input type="file" id="file" accept="image/*">
        <div class="drop-copy">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
            <path d="M4 8h3l2-3h6l2 3h3v12H4z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
          <strong>Tap to take or upload a photo</strong>
          Candy wrapper, bottle, banana peel — anything you need to toss.
        </div>
        <img id="preview" alt="Chosen item">
        <div class="change">Tap to choose a different photo</div>
      </label>
      <button id="go" type="button" disabled>
        <span class="spinner" aria-hidden="true"></span>
        <span id="goLabel">Identify it</span>
      </button>
    </section>

    <section class="card" id="result" aria-live="polite" hidden>
      <h2>Where it goes</h2>
      <div class="answer" id="answer">
        <p class="kicker" id="kicker"></p>
        <p class="headline" id="headline"></p>
        <p class="note" id="note"></p>
        <div class="meta">
          <span class="pill" id="itemPill"></span>
          <span class="pill" id="materialPill"></span>
        </div>
        <p class="explain" id="explanation"></p>
        <p class="tip" id="tip"></p>
      </div>
    </section>

    <div id="error" role="alert"></div>
  </div>

  <script>
    const BINS = [
      { id: "recycling", label: "Recycling (plastic, metal, cardboard)" },
      { id: "paper", label: "Paper-only bin" },
      { id: "glass", label: "Glass bin" },
      { id: "compost", label: "Compost / food scraps" },
      { id: "landfill", label: "General trash" },
      { id: "dropoff", label: "Special drop-off (e-waste, batteries, hazardous)" }
    ];
    const STORAGE_KEY = "which-bin-bins";
    const DEFAULT_BINS = ["recycling", "landfill"];

    const fileInput = document.getElementById("file");
    const drop = document.getElementById("drop");
    const preview = document.getElementById("preview");
    const go = document.getElementById("go");
    const goLabel = document.getElementById("goLabel");
    const result = document.getElementById("result");
    const answer = document.getElementById("answer");
    const errorEl = document.getElementById("error");
    const checkboxes = [...document.querySelectorAll('#bins input[type="checkbox"]')];

    let photoBlob = null;
    let previewUrl = null;
    let lastResult = null;

    function labelOf(id) {
      const found = BINS.find((b) => b.id === id);
      return found ? found.label : id;
    }

    function selectedBins() {
      return new Set(checkboxes.filter((c) => c.checked).map((c) => c.value));
    }

    function saveBins() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify([...selectedBins()]));
      } catch (e) {}
    }

    function loadBins() {
      let chosen = DEFAULT_BINS;
      try {
        const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
        if (Array.isArray(raw) && raw.length) chosen = raw;
      } catch (e) {}
      checkboxes.forEach((c) => { c.checked = chosen.includes(c.value); });
    }

    function showError(message) {
      errorEl.textContent = message;
      errorEl.style.display = "block";
    }

    function hideError() {
      errorEl.textContent = "";
      errorEl.style.display = "none";
    }

    function shrinkPhoto(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          const max = 1024;
          const scale = Math.min(1, max / Math.max(img.width, img.height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.max(1, Math.round(img.width * scale));
          canvas.height = Math.max(1, Math.round(img.height * scale));
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          canvas.toBlob(
            (blob) => {
              URL.revokeObjectURL(url);
              if (blob) resolve(blob);
              else reject(new Error("Could not prepare that photo."));
            },
            "image/jpeg",
            0.85
          );
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error("Could not read that image. Try a JPEG or PNG."));
        };
        img.src = url;
      });
    }

    function setLoading(on) {
      go.classList.toggle("loading", on);
      go.disabled = on || !photoBlob;
      goLabel.textContent = on ? "Looking…" : "Identify it";
    }

    function renderResult(data) {
      const have = selectedBins();
      const ranked = (data.ranked_bins || []).filter((id) => BINS.some((b) => b.id === id));
      const best = ranked[0];
      const pick = ranked.find((id) => have.has(id));

      const kicker = document.getElementById("kicker");
      const headline = document.getElementById("headline");
      const note = document.getElementById("note");
      const itemPill = document.getElementById("itemPill");
      const materialPill = document.getElementById("materialPill");
      const explanation = document.getElementById("explanation");
      const tip = document.getElementById("tip");

      answer.classList.toggle("warn", !pick);

      if (pick) {
        kicker.textContent = "Best match for your bins";
        headline.textContent = "Put it in: " + labelOf(pick);
        note.textContent = pick !== best
          ? "It ideally goes in " + labelOf(best) + ", but you don't have one."
          : "";
      } else {
        kicker.textContent = "No matching bin selected";
        headline.textContent = "None of your bins fit";
        note.textContent = "It belongs in " + labelOf(best) + ". Tick the bins you have above, or find a drop-off.";
      }

      itemPill.textContent = data.item || "Item";
      materialPill.textContent = data.material || "";
      materialPill.style.display = data.material ? "" : "none";
      explanation.textContent = data.explanation || "";
      tip.textContent = data.tip ? "Tip: " + data.tip : "";

      result.hidden = false;
      result.style.display = "block";
    }

    loadBins();

    checkboxes.forEach((c) => {
      c.addEventListener("change", () => {
        saveBins();
        if (lastResult) renderResult(lastResult);
      });
    });

    fileInput.addEventListener("change", async (event) => {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      hideError();
      lastResult = null;
      result.hidden = true;
      result.style.display = "none";
      go.disabled = true;
      try {
        photoBlob = await shrinkPhoto(file);
        if (previewUrl) URL.revokeObjectURL(previewUrl);
        previewUrl = URL.createObjectURL(photoBlob);
        preview.src = previewUrl;
        drop.classList.add("has-photo");
        go.disabled = false;
      } catch (err) {
        photoBlob = null;
        drop.classList.remove("has-photo");
        showError(err.message || "Could not use that photo.");
      }
    });

    go.addEventListener("click", async () => {
      if (!photoBlob) return;
      hideError();
      setLoading(true);
      try {
        const formData = new FormData();
        formData.append("photo", photoBlob, "item.jpg");
        const resp = await fetch("/api/identify", { method: "POST", body: formData });
        let payload = {};
        try {
          payload = await resp.json();
        } catch (e) {
          payload = {};
        }
        if (!resp.ok) {
          throw new Error(payload.error || "Something went wrong.");
        }
        lastResult = payload;
        renderResult(payload);
      } catch (err) {
        showError(err.message || "Something went wrong. Try another photo.");
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
